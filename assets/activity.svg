<svg fill="none" width="860" height="150" viewBox="0 0 860 150" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #0c0a09; stroke: #1e293b; stroke-width: 1; }
    .title { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 15px; fill: #38bdf8; }
    .sub { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: #64748b; }
    .c1 { fill: #0e4429; }
    .c2 { fill: #006d32; }
    .c3 { fill: #26a641; }
    .c4 { fill: #39d353; }
  </style>

  <rect width="860" height="150" rx="10" class="bg"/>

  <text x="25" y="30" class="title">📈 Contribution Activity Graph</text>
  <text x="835" y="30" text-anchor="end" class="sub">github.com/darshc17</text>

  <!-- Activity Grid Pattern -->
  <g transform="translate(25, 45)">
    <rect x="0" y="0" width="810" height="75" rx="6" fill="#141416"/>

    <!-- Decorative activity blocks -->
    <path d="M15 15h10v10H15z" class="c2"/>
    <path d="M15 30h10v10H15z" class="c3"/>
    <path d="M15 45h10v10H15z" class="c4"/>
    <path d="M35 15h10v10H35z" class="c1"/>
    <path d="M35 30h10v10H35z" class="c4"/>
    <path d="M55 15h10v10H55z" class="c3"/>
    <path d="M55 45h10v10H55z" class="c2"/>
    <path d="M75 30h10v10H75z" class="c4"/>
    <path d="M95 15h10v10H95z" class="c3"/>

    <!-- Wave line representing activity -->
    <path d="M 0 50 Q 100 15, 200 35 T 400 25 T 600 15 T 810 30" stroke="#38bdf8" stroke-width="2.5" fill="none"/>
    <path d="M 0 50 Q 100 15, 200 35 T 400 25 T 600 15 T 810 30 L 810 75 L 0 75 Z" fill="#0284c7" fill-opacity="0.15"/>
  </g>
</svg>
