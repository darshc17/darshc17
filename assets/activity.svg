<svg fill="none" width="860" height="150" viewBox="0 0 860 150" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #0c0a09; stroke: #1e293b; stroke-width: 1; }
    .title { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 15px; fill: #38bdf8; }
    .sub { font-family: 'Inter', sans-serif; font-size: 12px; fill: #64748b; }
    .grid-bg { fill: #18181b; }
    .c1 { fill: #0e4429; }
    .c2 { fill: #006d32; }
    .c3 { fill: #26a641; }
    .c4 { fill: #39d353; }
  </style>

  <rect width="860" height="150" rx="10" class="bg"/>

  <text x="25" y="30" class="title">📈 Contribution Activity Graph</text>
  <text x="835" y="30" text-anchor="end" class="sub">darshc17 GitHub Activity</text>

  <!-- Activity Grid Pattern -->
  <g transform="translate(25, 45)">
    <!-- Generating activity blocks pattern -->
    <rect x="0" y="0" width="810" height="75" rx="6" fill="#141416"/>

    <!-- Decorative green activity squares simulating continuous contributions -->
    <path d="M15 15h10v10H15z" class="c2"/>
    <path d="M15 30h10v10H15z" class="c3"/>
    <path d="M15 45h10v10H15z" class="c4"/>
    <path d="M30 15h10v10H30z" class="c1"/>
    <path d="M30 30h10v10H30z" class="c4"/>
    <path d="M45 15h10v10H45z" class="c3"/>
    <path d="M45 45h10v10H45z" class="c2"/>
    <path d="M60 30h10v10H60z" class="c4"/>

    <!-- Dynamic wave line -->
    <path d="M 0 50 Q 100 10, 200 40 T 400 30 T 600 15 T 810 35" stroke="#38bdf8" stroke-width="2.5" fill="none"/>
    <path d="M 0 50 Q 100 10, 200 40 T 400 30 T 600 15 T 810 35 L 810 75 L 0 75 Z" fill="#0284c7" fill-opacity="0.15"/>
  </g>
</svg>
