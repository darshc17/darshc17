<svg fill="none" width="360" height="195" viewBox="0 0 360 195" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #0c0a09; stroke: #1e293b; stroke-width: 1; }
    .title { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 16px; fill: #38bdf8; }
    .lang-name { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: #cbd5e1; font-weight: 600; }
    .lang-pct { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #94a3b8; }
  </style>

  <rect width="360" height="195" rx="10" class="bg"/>

  <text x="25" y="35" class="title">🚀 Most Used Languages</text>

  <g transform="translate(25, 55)">
    <!-- JavaScript & TypeScript -->
    <text x="0" y="12" class="lang-name">JavaScript &amp; TypeScript</text>
    <text x="310" y="12" text-anchor="end" class="lang-pct">55%</text>
    <rect x="0" y="20" width="310" height="7" rx="3.5" fill="#1e293b"/>
    <rect x="0" y="20" width="170" height="7" rx="3.5" fill="#3178c6"/>

    <!-- Python -->
    <text x="0" y="47" class="lang-name">Python (AI/ML &amp; Scripts)</text>
    <text x="310" y="47" text-anchor="end" class="lang-pct">25%</text>
    <rect x="0" y="55" width="310" height="7" rx="3.5" fill="#1e293b"/>
    <rect x="0" y="55" width="78" height="7" rx="3.5" fill="#38bdf8"/>

    <!-- Java -->
    <text x="0" y="82" class="lang-name">Java &amp; Algorithms</text>
    <text x="310" y="82" text-anchor="end" class="lang-pct">12%</text>
    <rect x="0" y="90" width="310" height="7" rx="3.5" fill="#1e293b"/>
    <rect x="0" y="90" width="37" height="7" rx="3.5" fill="#f59e0b"/>

    <!-- HTML / CSS -->
    <text x="0" y="117" class="lang-name">HTML5 &amp; CSS3</text>
    <text x="310" y="117" text-anchor="end" class="lang-pct">8%</text>
    <rect x="0" y="125" width="310" height="7" rx="3.5" fill="#1e293b"/>
    <rect x="0" y="125" width="25" height="7" rx="3.5" fill="#e34f26"/>
  </g>
</svg>
