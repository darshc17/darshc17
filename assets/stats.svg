<svg fill="none" width="490" height="195" viewBox="0 0 490 195" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #0c0a09; stroke: #1e293b; stroke-width: 1; }
    .title { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 16px; fill: #38bdf8; }
    .label { font-family: 'Inter', sans-serif; font-size: 13px; fill: #94a3b8; }
    .value { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 700; fill: #f8fafc; }
    .icon { fill: #38bdf8; }
  </style>

  <rect width="490" height="195" rx="10" class="bg"/>

  <text x="25" y="35" class="title">⚡ Darsh's GitHub Stats</text>

  <g transform="translate(25, 60)">
    <!-- Total Stars -->
    <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" transform="scale(0.8)" class="icon"/>
    <text x="25" y="14" class="label">Total Stars Earned:</text>
    <text x="440" y="14" text-anchor="end" class="value">Multiple Stars</text>

    <!-- Total Commits -->
    <g transform="translate(0, 30)">
      <circle cx="10" cy="10" r="6" stroke="#38bdf8" stroke-width="2" fill="none"/>
      <text x="25" y="14" class="label">Total Commits (2026):</text>
      <text x="440" y="14" text-anchor="end" class="value">500+</text>
    </g>

    <!-- Total PRs -->
    <g transform="translate(0, 60)">
      <path d="M6 3a3 3 0 00-3 3v12a3 3 0 006 0V6a3 3 0 00-3-3zm12 0a3 3 0 00-3 3v12a3 3 0 006 0V6a3 3 0 00-3-3z" transform="scale(0.7)" class="icon"/>
      <text x="25" y="14" class="label">Total Pull Requests:</text>
      <text x="440" y="14" text-anchor="end" class="value">45+</text>
    </g>

    <!-- Total Issues -->
    <g transform="translate(0, 90)">
      <circle cx="10" cy="10" r="7" stroke="#38bdf8" stroke-width="2" fill="none"/>
      <text x="25" y="14" class="label">Total Issues:</text>
      <text x="440" y="14" text-anchor="end" class="value">20+</text>
    </g>
