<svg fill="none" width="490" height="195" viewBox="0 0 490 195" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #0c0a09; stroke: #1e293b; stroke-width: 1; }
    .title { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 16px; fill: #38bdf8; }
    .label { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: #94a3b8; }
    .value { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; fill: #f8fafc; }
    .accent { fill: #0284c7; }
    .icon { fill: #38bdf8; }
  </style>

  <rect width="490" height="195" rx="10" class="bg"/>

  <text x="25" y="35" class="title">⚡ Darsh's GitHub Overview</text>

  <g transform="translate(25, 55)">
    <!-- Public Repos -->
    <g transform="translate(0, 5)">
      <circle cx="10" cy="8" r="5" stroke="#38bdf8" stroke-width="2" fill="none"/>
      <text x="28" y="12" class="label">Public Repositories:</text>
      <text x="440" y="12" text-anchor="end" class="value">14 Repositories</text>
    </g>

    <!-- Core Focus -->
    <g transform="translate(0, 35)">
      <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" transform="scale(0.7) translate(2, -2)" class="icon"/>
      <text x="28" y="12" class="label">Primary Stack:</text>
      <text x="440" y="12" text-anchor="end" class="value" fill="#38bdf8">React Native · Hono.js</text>
    </g>

    <!-- Experience & Domain -->
    <g transform="translate(0, 65)">
      <path d="M6 3a3 3 0 00-3 3v12a3 3 0 006 0V6a3 3 0 00-3-3zm12 0a3 3 0 00-3 3v12a3 3 0 006 0V6a3 3 0 00-3-3z" transform="scale(0.65) translate(4, -2)" class="icon"/>
      <text x="28" y="12" class="label">Organization / Work:</text>
      <text x="440" y="12" text-anchor="end" class="value">Software Engineer @ LiftUp Labs</text>
    </g>

    <!-- Profile Status -->
    <g transform="translate(0, 95)">
      <circle cx="10" cy="8" r="6" fill="#22c55e" fill-opacity="0.2" stroke="#22c55e" stroke-width="2"/>
      <text x="28" y="12" class="label">Developer Status:</text>
      <text x="440" y="12" text-anchor="end" class="value" fill="#4ade80">● Active Developer</text>
    </g>
  </g>
